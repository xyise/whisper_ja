[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "whisper-subtitle-app"
version = "0.1.0"
description = "macOS subtitle app that captures audio from a selected video app and transcribes it with Whisper"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "PySide6>=6.8",
  "faster-whisper>=1.1.0",
]

[project.scripts]
whisper-subtitle-app = "whisper_subtitle_app.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
